[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "watchdog>=6.0.0",
  "textual-dev>=1.8.0",
  "black>=26.10.1",
  "isort>=9.0.2",
  "flake8>=7.4.1",
  "blacken-docs>=1.20.0",
  "pytest>=9.1.1",
  "mypy>=2.4.0",
  "types-psutil>=7.2.2",
  "argparse-manpage>=4.8",
  "pytest-textual-snapshot>=1.0.0",
]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"

# py-cpuinfo and distro ship no type information; tomli is only installed on 3.10.
[[tool.mypy.overrides]]
module = ["cpuinfo", "distro", "tomli"]
ignore_missing_imports = true

[project]
name = "sot"
authors = [{ name = "Kumar Anirudha", email = "sot@anirudha.dev" }]
description = "System Oberving Tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
keywords = ["cli", "system", "monitor", "linux", "tools"]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "py-cpuinfo>=9.0.0",
  "distro>=1.9.0",
  "psutil>=7.2.2",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "tomli>=2.5.0; python_version < '3.11'",
]

[tool.hatch.version]
path = "src/sot/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sot"]

[tool.hatch.build.targets.wheel.shared-data]
"man" = "share/man/man1"

[tool.hatch.build.targets.sdist]
exclude = [
  "images",
]

[project.urls]
Code = "https://github.com/anistark/sot"
Issues = "https://github.com/anistark/sot/issues"
Homepage = "https://github.com/anistark/sot"
Documentation = "https://github.com/anistark/sot#readme"

[project.scripts]
sot = "sot._app:run"
